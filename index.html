<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הדריה — רווח</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600&family=Frank+Ruhl+Libre:wght@400;500&display=swap">
<style>
  /* ============================================================
     שפת המותג של הדריה (נדגמה מ-hadaryadesign.com):
     קרם #f3eee8, אספרסו #3a2115, טאופ חם #8e7d6d, גופן Heebo.
     צבעי הסדרות הם הכחול והכתום המאומתים — הם עברו את כל בדיקות
     הנגישות מול הקרם, כולל pairs:all. צמד חום-על-חום היה נכשל.
     ============================================================ */
  :root {
    color-scheme: light;
    --surface-1: #fbf9f6; --surface-2: #f7f3ed; --page: #f3eee8;
    --text-primary: #121212; --text-secondary: #52463c; --text-muted: #8e7d6d;
    --grid: #e6ded3; --baseline: #cfc5b8; --border: rgba(58,33,21,0.14);
    --accent: #3a2115; --accent-ink: #f3eee8;
    --series-income: #2a78d6; --series-expense: #eb6834;
    --profit-pos: #2a78d6; --profit-neg: #e34948;
    --good: #0ca30c; --good-ink: #006300;
    --warning: #fab219; --critical: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface-1: #251a12; --surface-2: #2e2018; --page: #1a120c;
      --text-primary: #f3eee8; --text-secondary: #cbbcae; --text-muted: #8e7d6d;
      --grid: #35271c; --baseline: #4a382a; --border: rgba(243,238,232,0.13);
      --accent: #f3eee8; --accent-ink: #221108;
      --series-income: #3987e5; --series-expense: #d95926;
      --profit-pos: #3987e5; --profit-neg: #e66767;
      --good: #0ca30c; --good-ink: #0ca30c;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1: #251a12; --surface-2: #2e2018; --page: #1a120c;
    --text-primary: #f3eee8; --text-secondary: #cbbcae; --text-muted: #8e7d6d;
    --grid: #35271c; --baseline: #4a382a; --border: rgba(243,238,232,0.13);
    --accent: #f3eee8; --accent-ink: #221108;
    --series-income: #3987e5; --series-expense: #d95926;
    --profit-pos: #3987e5; --profit-neg: #e66767;
    --good: #0ca30c; --good-ink: #0ca30c;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--text-primary);
    font-family: "Heebo", system-ui, -apple-system, sans-serif;
    font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1240px; margin: 0 auto; padding-block: 38px 72px; padding-inline: 22px; }

  /* מספרים תמיד LTR: בדף RTL טווח כמו 13.9–19.9 מתהפך והמינוס נודד לסוף */
  .num-ltr, .tick, .peak-label, .kpi-value, .kpi-sub b, td.num, .tip .t-row b, .delta { direction: ltr; unicode-bidi: isolate; }

  header { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; justify-content: space-between; margin-bottom: 24px; }
  .brand { font-size: 11px; letter-spacing: .26em; color: var(--text-muted); font-weight: 500; margin-bottom: 7px; }
  h1 { font-family: "Frank Ruhl Libre", Georgia, serif; font-size: 30px; font-weight: 500; margin: 0; line-height: 1.2; }
  .sub { color: var(--text-secondary); font-size: 13px; margin-top: 6px; }
  .stamp { color: var(--text-muted); font-size: 12px; }

  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 20px 22px; }

  .section-title { font-family: "Frank Ruhl Libre", Georgia, serif; font-size: 19px; font-weight: 500; margin: 34px 0 13px; }

  /* ---- סרגל כיסוי נתונים ---- */
  .coverage { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 11px;
              border: 1px solid var(--border); border-inline-start: 3px solid var(--warning);
              background: var(--surface-1); margin-bottom: 14px; }
  .coverage.crit { border-inline-start-color: var(--critical); }
  .coverage .ico { flex: none; font-size: 15px; }
  .coverage b { font-weight: 600; }
  .coverage p { margin: 4px 0 0; color: var(--text-secondary); font-size: 13px; }
  .months { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
  .chip { font-size: 11.5px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--border); color: var(--text-secondary); }
  .chip.has { background: var(--surface-2); color: var(--text-primary); font-weight: 500; }
  .chip.none { opacity: .72; text-decoration: line-through; text-decoration-thickness: 1px; }

  /* ---- כרטיסי תקופה ---- */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(232px, 1fr)); gap: 13px; }
  .kpi { position: relative; }
  .kpi-label { color: var(--text-muted); font-size: 11px; letter-spacing: .14em; font-weight: 500; }
  .kpi-span { color: var(--text-muted); font-size: 11.5px; margin-top: 2px; }
  .kpi-value { font-size: 32px; font-weight: 500; letter-spacing: -0.02em; margin-top: 10px; line-height: 1.15; }
  .kpi-value.quiet { color: var(--text-muted); font-size: 21px; font-weight: 400; }
  .pos { color: var(--good-ink); } .neg { color: var(--profit-neg); }
  .delta { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; margin-top: 8px;
           padding: 3px 9px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface-2); }
  .delta .arrow { font-size: 10px; }
  .delta.up { color: var(--good-ink); } .delta.down { color: var(--profit-neg); }
  .delta.flat { color: var(--text-muted); }
  .kpi-sub { margin-top: 13px; padding-top: 11px; border-top: 1px solid var(--grid); display: flex; flex-direction: column; gap: 5px; }
  .kpi-sub div { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--text-secondary); }
  .kpi-sub b { font-weight: 500; color: var(--text-primary); font-variant-numeric: tabular-nums; }
  .kpi-flag { margin-top: 11px; font-size: 11.5px; color: var(--text-muted); display: flex; gap: 6px; align-items: flex-start; }

  /* ---- שורת סינון ---- */
  .filters { display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: center; margin-bottom: 16px; }
  .fgroup { display: flex; align-items: center; gap: 9px; }
  .flabel { color: var(--text-muted); font-size: 11px; letter-spacing: .12em; font-weight: 500; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; background: var(--surface-1); }
  .seg button { font: inherit; font-size: 13px; padding: 6px 16px; border: 0; cursor: pointer; background: transparent;
                color: var(--text-secondary); min-height: 32px; transition: background .12s, color .12s; }
  .seg button:hover { background: var(--grid); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .chk { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--text-secondary); cursor: pointer; }
  .chk input { accent-color: var(--accent); width: 15px; height: 15px; }

  /* ---- תרשימים ---- */
  .chart-card { margin-bottom: 16px; position: relative; }
  .chart-head { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: baseline; }
  h2 { font-family: "Frank Ruhl Libre", Georgia, serif; font-size: 17px; font-weight: 500; margin: 0; }
  .chart-sub { color: var(--text-muted); font-size: 12px; margin-top: 3px; }
  .legend { display: flex; gap: 15px; flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--text-secondary); }
  .swatch { width: 10px; height: 10px; border-radius: 2px; flex: none; }
  .swatch.hatch { background: repeating-linear-gradient(45deg, var(--baseline) 0 2px, transparent 2px 5px); border: 1px solid var(--baseline); }
  .plot { width: 100%; height: auto; display: block; margin-top: 10px; overflow: visible; }
  .plot text { font-family: "Heebo", system-ui, sans-serif; }
  .tick { fill: var(--text-muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .band-label { fill: var(--text-secondary); font-size: 11.5px; }
  .peak-label { fill: var(--text-primary); font-size: 11.5px; font-weight: 600; }
  .nodata-mark { fill: var(--text-muted); font-size: 10.5px; }

  .tip { position: absolute; pointer-events: none; z-index: 5; opacity: 0; transition: opacity .09s;
         background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
         font-size: 12.5px; box-shadow: 0 6px 20px rgba(58,33,21,.16); min-width: 150px; }
  .tip.on { opacity: 1; }
  .tip .t-title { font-weight: 600; margin-bottom: 6px; }
  .tip .t-row { display: flex; justify-content: space-between; gap: 15px; color: var(--text-secondary); }
  .tip .t-row b { color: var(--text-primary); font-weight: 600; font-variant-numeric: tabular-nums; }
  .tip .t-note { margin-top: 6px; color: var(--text-muted); font-size: 11.5px; }

  .tablewrap { overflow-x: auto; margin-top: 8px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: right; padding: 9px 11px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
  th { color: var(--text-muted); font-weight: 500; font-size: 11px; letter-spacing: .1em; }
  td.num { font-variant-numeric: tabular-nums; }
  td.muted { color: var(--text-muted); }
  tfoot td { font-weight: 600; border-top: 2px solid var(--baseline); border-bottom: 0; }

  .state { padding: 46px 20px; text-align: center; color: var(--text-secondary); }
  .state.err { color: var(--profit-neg); }
  details.raw { margin-top: 16px; }
  details.raw summary { cursor: pointer; color: var(--text-secondary); font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="brand">HADARYA</div>
      <h1>רווח</h1>
      <div class="sub">נתונים חיים מלוחות המאנדיי «הכנסות והזמנות» ו«הוצאות»</div>
    </div>
    <div class="stamp" id="stamp"></div>
  </header>
  <div id="app"><div class="state">טוען נתונים ממאנדיי…</div></div>
</div>

<script>
(() => {
  'use strict';
  const app = document.getElementById('app');
  const stamp = document.getElementById('stamp');

  const state = { data: null, grain: 'month', includeReceipts: false, includeReview: true, view: 'chart' };

  // ---------- תאריכים ומספרים ----------
  const MONTHS = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
  const shekel = (n) => (n < 0 ? '-' : '') + '₪' + Math.round(Math.abs(n)).toLocaleString('he-IL');
  const compact = (n) => {
    const a = Math.abs(n);
    if (a >= 1000) return (n / 1000).toLocaleString('he-IL', { maximumFractionDigits: a >= 10000 ? 0 : 1 }) + 'K';
    return Math.round(n).toLocaleString('he-IL');
  };
  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

  const parseDate = (s) => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; };
  const iso = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const addDays = (d, n) => { const o = new Date(d); o.setDate(o.getDate() + n); return o; };
  const dm = (d) => `${d.getDate()}.${d.getMonth()+1}`;
  /** תחילת השבוע בישראל היא יום ראשון */
  const weekStart = (d) => addDays(d, -d.getDay());

  // ---------- סינון ----------
  function activeRows() {
    const d = state.data;
    const ok = (r) => r.date && r.amount !== null;
    return {
      income: d.income.filter(ok),
      expenses: d.expenses.filter(r => ok(r) && (state.includeReceipts || !r.isReceipt) && (state.includeReview || !r.needsReview)),
    };
  }

  /** סכום בטווח תאריכים כולל. מחזיר גם ספירות — אפס רשומות אינו אפס שקלים. */
  function between(rows, from, to) {
    const a = iso(from), b = iso(to);
    const pick = (list) => list.filter(r => r.date >= a && r.date <= b);
    const inc = pick(rows.income), exp = pick(rows.expenses);
    const sum = (l) => l.reduce((t, r) => t + r.amount, 0);
    return {
      income: sum(inc), expenses: sum(exp),
      incomeCount: inc.length, expenseCount: exp.length,
      profit: sum(inc) - sum(exp),
    };
  }

  // ---------- כרטיסי תקופה ----------
  /**
   * כל תקופה מושווית לטווח באותו אורך, לא לחודש או שבוע מלא:
   * 1–14 בספטמבר מול 1–14 באוגוסט. השוואה לחודש מלא הייתה
   * מציגה נפילה מדומה בכל תחילת חודש.
   */
  function periods(rows) {
    const today = new Date(); today.setHours(0,0,0,0);
    const y = addDays(today, -1);
    const ws = weekStart(today);
    const ms = new Date(today.getFullYear(), today.getMonth(), 1);
    const daysIn = Math.round((today - ms) / 86400000);
    const prevMs = new Date(today.getFullYear(), today.getMonth() - 1, 1);

    return [
      { key:'today', label:'היום', span: dm(today),
        cur: between(rows, today, today), prev: between(rows, y, y), prevLabel:`מול ${dm(y)}` },
      { key:'yesterday', label:'אתמול', span: dm(y),
        cur: between(rows, y, y), prev: between(rows, addDays(y,-1), addDays(y,-1)), prevLabel:`מול ${dm(addDays(y,-1))}` },
      { key:'week', label:'השבוע', span:`${dm(ws)}–${dm(today)}`,
        cur: between(rows, ws, today), prev: between(rows, addDays(ws,-7), addDays(today,-7)),
        prevLabel:`מול ${dm(addDays(ws,-7))}–${dm(addDays(today,-7))}` },
      { key:'month', label:'החודש', span:`${dm(ms)}–${dm(today)}`,
        cur: between(rows, ms, today), prev: between(rows, prevMs, addDays(prevMs, daysIn)),
        prevLabel:`מול ${dm(prevMs)}–${dm(addDays(prevMs, daysIn))}` },
    ];
  }

  function deltaChip(cur, prev) {
    if (prev.incomeCount === 0 && prev.expenseCount === 0)
      return `<div class="delta flat">אין בסיס להשוואה</div>`;

    const diff = cur.profit - prev.profit;
    if (Math.abs(diff) < 1) return `<div class="delta flat">ללא שינוי</div>`;

    /**
     * ההפרש בשקלים הוא המדד, לא האחוז. אחוז שינוי בין רווח להפסד
     * חוצה את האפס ואינו מוגדר — הוא מייצר מספרים כמו 2382% שאינם
     * אומרים דבר. האחוז מתלווה רק כששתי התקופות באותו סימן.
     */
    const sameSign = (cur.profit >= 0) === (prev.profit >= 0);
    const pct = (sameSign && prev.profit !== 0) ? Math.abs(diff / prev.profit) * 100 : null;
    const pctText = (pct !== null && pct < 1000) ? ` · ${pct.toFixed(0)}%` : '';
    const up = diff > 0;
    return `<div class="delta ${up ? 'up' : 'down'}"><span class="arrow">${up ? '▲' : '▼'}</span>${esc(shekel(Math.abs(diff)))}${pctText}</div>`;
  }

  function kpiCard(p) {
    const c = p.cur;
    const quiet = c.incomeCount === 0 && c.expenseCount === 0;
    const value = quiet
      ? `<div class="kpi-value quiet">אין תנועה</div>`
      : `<div class="kpi-value ${c.profit >= 0 ? 'pos' : 'neg'}">${esc(shekel(c.profit))}</div>`;

    // רווח בלי ולו הוצאה אחת רשומה אינו רווח — הוא הכנסה
    const flag = (c.incomeCount > 0 && c.expenseCount === 0)
      ? `<div class="kpi-flag"><span>⚑</span><span>אין הוצאות רשומות בתקופה — הסכום הזה הוא הכנסה, לא רווח</span></div>` : '';

    return `<div class="card kpi">
      <div class="kpi-label">${esc(p.label)}</div>
      <div class="kpi-span num-ltr">${esc(p.span)}</div>
      ${value}
      ${quiet ? '' : deltaChip(c, p.prev)}
      <div class="kpi-sub">
        <div><span>הכנסות</span><b>${esc(shekel(c.income))}</b></div>
        <div><span>הוצאות</span><b>${esc(shekel(c.expenses))}</b></div>
      </div>
      ${flag}
      <div class="kpi-flag"><span style="opacity:.6">↺</span><span class="num-ltr">${esc(p.prevLabel)}</span></div>
    </div>`;
  }

  // ---------- צבירה לתקופות ----------
  const bucketKey = (d, grain) => grain === 'week'
    ? iso(weekStart(d)) : `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;

  const bucketLabel = (key, grain) => {
    if (grain === 'week') { const s = parseDate(key); return `${dm(s)}–${dm(addDays(s,6))}`; }
    const [yy, mm] = key.split('-');
    return `${MONTHS[+mm - 1]} ${yy}`;
  };

  function fillRange(keys, grain) {
    if (!keys.length) return [];
    const s = [...keys].sort(), out = [];
    if (grain === 'week') {
      const cur = parseDate(s[0]), last = parseDate(s[s.length-1]);
      while (cur <= last) { out.push(iso(cur)); cur.setDate(cur.getDate()+7); }
    } else {
      let [y, m] = s[0].split('-').map(Number);
      const [ly, lm] = s[s.length-1].split('-').map(Number);
      while (y < ly || (y === ly && m <= lm)) { out.push(`${y}-${String(m).padStart(2,'0')}`); if (++m > 12) { m = 1; y++; } }
    }
    return out;
  }

  function aggregate(rows) {
    const map = new Map();
    const touch = (k) => { if (!map.has(k)) map.set(k, { income:0, expenses:0, incomeCount:0, expenseCount:0 }); return map.get(k); };
    for (const r of rows.income)   { const b = touch(bucketKey(parseDate(r.date), state.grain)); b.income += r.amount; b.incomeCount++; }
    for (const r of rows.expenses) { const b = touch(bucketKey(parseDate(r.date), state.grain)); b.expenses += r.amount; b.expenseCount++; }

    return fillRange([...map.keys()], state.grain).map(key => {
      const b = map.get(key) || { income:0, expenses:0, incomeCount:0, expenseCount:0 };
      return { ...b, key, label: bucketLabel(key, state.grain), profit: b.income - b.expenses, noExpenseData: b.expenseCount === 0 };
    });
  }

  // ---------- גיאומטריה ----------
  const W = 900, H = 330, M = { top: 30, right: 62, bottom: 46, left: 14 };
  const plotW = W - M.right - M.left, plotH = H - M.top - M.bottom;

  function niceScale(min, max, ticks = 4) {
    const span = (max - min) || 1;
    const raw = span / ticks;
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const n = raw / mag;
    const step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
    return { lo: Math.floor(min/step)*step, hi: Math.ceil(max/step)*step, step };
  }

  function barPath(x, y, w, h, r = 4) {
    if (h <= 0.5) return '';
    const rr = Math.min(r, h, w/2);
    return `M${x},${y+h} L${x},${y+rr} Q${x},${y} ${x+rr},${y} L${x+w-rr},${y} Q${x+w},${y} ${x+w},${y+rr} L${x+w},${y+h} Z`;
  }

  const HATCH = `<defs><pattern id="hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="var(--surface-1)"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="var(--baseline)" stroke-width="2"/></pattern></defs>`;

  function yAxis(sc) {
    let out = '';
    for (let v = sc.lo; v <= sc.hi + sc.step/2; v += sc.step) {
      const y = M.top + plotH - ((v - sc.lo)/(sc.hi - sc.lo)) * plotH;
      out += `<line x1="${M.left}" y1="${y}" x2="${M.left+plotW}" y2="${y}" stroke="var(--grid)" stroke-width="1"/>`;
      out += `<text class="tick" x="${M.left+plotW+8}" y="${y+4}" text-anchor="start">${esc(compact(v))}</text>`;
    }
    return out;
  }

  /** תרשים הכנסות מול הוצאות. תקופה בלי ולו הוצאה אחת מסומנת בהצללה ובתווית. */
  function renderTrend(buckets) {
    if (!buckets.length) return '<div class="state">אין נתונים.</div>';
    const sc = niceScale(0, Math.max(1, ...buckets.map(b => Math.max(b.income, b.expenses))));
    const band = plotW / buckets.length;
    const barW = Math.max(5, Math.min(26, band/2 - 3));
    const y = (v) => M.top + plotH - (v/sc.hi) * plotH;
    const peak = buckets.reduce((best, b, i) => (b.income > buckets[best].income ? i : best), 0);
    const nth = Math.ceil(buckets.length / 13);
    const ltr = state.grain === 'week' ? ' num-ltr' : '';

    let marks = '', labels = '', hits = '';
    buckets.forEach((b, i) => {
      const cx = M.left + band * (i + 0.5);
      const xi = cx - barW - 1, xe = cx + 1;   // 2px רווח משטח בין העמודים
      marks += `<path d="${barPath(xi, y(b.income), barW, M.top + plotH - y(b.income))}" fill="var(--series-income)"/>`;
      if (b.noExpenseData) {
        marks += `<rect x="${xe}" y="${M.top + plotH - 16}" width="${barW}" height="16" fill="url(#hatch)" stroke="var(--baseline)" stroke-width="1"/>`;
        labels += `<text class="nodata-mark" x="${xe + barW/2}" y="${M.top + plotH - 21}" text-anchor="middle">אין נתון</text>`;
      } else {
        marks += `<path d="${barPath(xe, y(b.expenses), barW, M.top + plotH - y(b.expenses))}" fill="var(--series-expense)"/>`;
      }
      if ((buckets.length - 1 - i) % nth === 0)
        labels += `<text class="band-label${ltr}" x="${cx}" y="${M.top+plotH+18}" text-anchor="middle">${esc(b.label)}</text>`;
      if (i === peak && b.income > 0)
        labels += `<text class="peak-label" x="${xi + barW/2}" y="${y(b.income)-8}" text-anchor="middle">${esc(shekel(b.income))}</text>`;
      hits += `<rect x="${M.left + band*i}" y="${M.top}" width="${band}" height="${plotH}" fill="transparent" data-i="${i}"/>`;
    });

    return `<svg class="plot" viewBox="0 0 ${W} ${H}" role="img" aria-label="הכנסות מול הוצאות">
      ${HATCH}${yAxis(sc)}${marks}
      <line x1="${M.left}" y1="${M.top+plotH}" x2="${M.left+plotW}" y2="${M.top+plotH}" stroke="var(--baseline)" stroke-width="1"/>
      ${labels}<g class="hits">${hits}</g></svg>`;
  }

  /** תרשים רווח. תקופה בלי נתוני הוצאה אינה מצוירת כרווח — היא מוצללת. */
  function renderProfit(buckets) {
    if (!buckets.length) return '<div class="state">אין נתונים.</div>';
    const real = buckets.filter(b => !b.noExpenseData);
    if (!real.length) return '<div class="state">אין אף תקופה שיש בה גם הכנסות וגם הוצאות רשומות.</div>';

    // אפס תמיד בסקאלה: גרף רווח בלי קו האפס מאבד את ההבחנה בין רווח להפסד
    const sc = niceScale(Math.min(0, ...real.map(b => b.profit)), Math.max(0, ...real.map(b => b.profit)));
    const y = (v) => M.top + plotH - ((v - sc.lo)/(sc.hi - sc.lo)) * plotH;
    const zero = y(0);
    const band = plotW / buckets.length;
    const barW = Math.max(6, Math.min(38, band * 0.55));
    const nth = Math.ceil(buckets.length / 13);
    const ltr = state.grain === 'week' ? ' num-ltr' : '';

    let marks = '', labels = '', hits = '';
    buckets.forEach((b, i) => {
      const cx = M.left + band*(i+0.5), x = cx - barW/2;
      if (b.noExpenseData) {
        marks += `<rect x="${x}" y="${zero-14}" width="${barW}" height="14" fill="url(#hatch)" stroke="var(--baseline)" stroke-width="1"/>`;
        labels += `<text class="nodata-mark" x="${cx}" y="${zero-19}" text-anchor="middle">אין נתון</text>`;
      } else {
        const up = b.profit >= 0, h = Math.abs(zero - y(b.profit));
        marks += up
          ? `<path d="${barPath(x, y(b.profit), barW, h)}" fill="var(--profit-pos)"/>`
          : `<path d="${barPath(x, zero, barW, h)}" fill="var(--profit-neg)" transform="rotate(180 ${x+barW/2} ${zero+h/2})"/>`;
      }
      if ((buckets.length - 1 - i) % nth === 0)
        labels += `<text class="band-label${ltr}" x="${cx}" y="${M.top+plotH+18}" text-anchor="middle">${esc(b.label)}</text>`;
      hits += `<rect x="${M.left+band*i}" y="${M.top}" width="${band}" height="${plotH}" fill="transparent" data-i="${i}"/>`;
    });

    return `<svg class="plot" viewBox="0 0 ${W} ${H}" role="img" aria-label="רווח לפי תקופה">
      ${HATCH}${yAxis(sc)}${marks}
      <line x1="${M.left}" y1="${zero}" x2="${M.left+plotW}" y2="${zero}" stroke="var(--baseline)" stroke-width="1"/>
      ${labels}<g class="hits">${hits}</g></svg>`;
  }

  // ---------- טבלה ----------
  function table(buckets) {
    const t = buckets.reduce((a, b) => ({ income: a.income+b.income, expenses: a.expenses+b.expenses }), { income:0, expenses:0 });
    t.profit = t.income - t.expenses;
    const rows = buckets.map(b => `<tr>
      <td>${esc(b.label)}</td>
      <td class="num">${esc(shekel(b.income))}</td>
      <td class="num ${b.noExpenseData ? 'muted' : ''}">${b.noExpenseData ? 'אין נתון' : esc(shekel(b.expenses))}</td>
      <td class="num ${b.noExpenseData ? 'muted' : (b.profit >= 0 ? 'pos' : 'neg')}">${b.noExpenseData ? '—' : esc(shekel(b.profit))}</td>
      <td class="num muted">${b.incomeCount} / ${b.expenseCount}</td>
    </tr>`).join('');

    return `<div class="tablewrap"><table>
      <thead><tr><th>תקופה</th><th>הכנסות</th><th>הוצאות</th><th>רווח</th><th>רשומות הכנסה / הוצאה</th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr><td>סך הכל</td><td class="num">${esc(shekel(t.income))}</td><td class="num">${esc(shekel(t.expenses))}</td>
      <td class="num ${t.profit>=0?'pos':'neg'}">${esc(shekel(t.profit))}</td><td></td></tr></tfoot></table></div>`;
  }

  // ---------- כיסוי נתונים ----------
  function coverage(rows) {
    const byMonth = new Map();
    const touch = (k) => { if (!byMonth.has(k)) byMonth.set(k, { inc:0, exp:0 }); return byMonth.get(k); };
    for (const r of rows.income) touch(bucketKey(parseDate(r.date), 'month')).inc++;
    for (const r of rows.expenses) touch(bucketKey(parseDate(r.date), 'month')).exp++;
    const keys = fillRange([...byMonth.keys()], 'month');
    const missing = keys.filter(k => (byMonth.get(k)?.exp || 0) === 0 && (byMonth.get(k)?.inc || 0) > 0);

    const chips = keys.map(k => {
      const v = byMonth.get(k) || { inc:0, exp:0 };
      const name = bucketLabel(k, 'month').replace(/ \d{4}$/, '');
      return `<span class="chip ${v.exp > 0 ? 'has' : 'none'}">${esc(name)}</span>`;
    }).join('');

    if (!missing.length) return '';
    return `<div class="coverage crit">
      <span class="ico">⚠</span>
      <div>
        <b>נתוני הוצאה קיימים רק לחלק מהחודשים</b>
        <p>ב-${missing.length} חודשים יש הכנסות רשומות בלי אף הוצאה. הרווח שלהם אינו מחושב ואינו מוצג בתרשימים —
           עמודה מוצללת מסמנת אותם. אלה כנראה הוצאות שטרם הוזנו למאנדיי, ולא חודשים ללא עלויות.</p>
        <div class="months">${chips}</div>
      </div></div>`;
  }

  function receiptsNotice(all) {
    const rec = all.filter(r => r.isReceipt), rev = all.filter(r => r.needsReview);
    let out = '';
    if (rec.length) {
      const s = rec.reduce((t,r) => t + (r.amount||0), 0);
      out += `<div class="coverage"><span class="ico">⧉</span><div>
        <b>${rec.length} רשומות מזוהות כקבלות (${esc(shekel(s))})</b>
        <p>${state.includeReceipts ? 'נספרות כרגע יחד עם החשבוניות שהן מתעדות, כך שההוצאות מנופחות.'
                                   : 'קבלה מתעדת חשבונית שכבר רשומה, ולכן היא מנוטרלת כברירת מחדל.'}</p></div></div>`;
    }
    if (rev.length) {
      const s = rev.reduce((t,r) => t + (r.amount||0), 0);
      out += `<div class="coverage"><span class="ico">⚑</span><div>
        <b>${rev.length} רשומות מסומנות «לבדיקה» (${esc(shekel(s))})</b>
        <p>${esc(rev.map(r => `${r.vendor || r.name} — ${shekel(r.amount||0)}`).join(' · '))}</p></div></div>`;
    }
    return out;
  }

  // ---------- הרכבה ----------
  function render() {
    const rows = activeRows();
    const buckets = aggregate(rows);
    const grainWord = state.grain === 'week' ? 'שבוע' : 'חודש';

    app.innerHTML = `
      ${coverage(rows)}
      ${receiptsNotice(state.data.expenses)}

      <div class="section-title">תקופות</div>
      <div class="kpis">${periods(rows).map(kpiCard).join('')}</div>

      <div class="section-title">מגמה</div>
      <div class="filters">
        <div class="fgroup"><span class="flabel">פילוח</span>
          <div class="seg" id="grain">
            <button data-v="month" aria-pressed="${state.grain==='month'}">חודשי</button>
            <button data-v="week" aria-pressed="${state.grain==='week'}">שבועי</button>
          </div></div>
        <div class="fgroup"><span class="flabel">תצוגה</span>
          <div class="seg" id="view">
            <button data-v="chart" aria-pressed="${state.view==='chart'}">תרשים</button>
            <button data-v="table" aria-pressed="${state.view==='table'}">טבלה</button>
          </div></div>
        <label class="chk"><input type="checkbox" id="rec" ${state.includeReceipts?'checked':''}> כלול קבלות</label>
        <label class="chk"><input type="checkbox" id="rev" ${state.includeReview?'checked':''}> כלול רשומות לבדיקה</label>
      </div>

      ${state.view === 'table' ? `<div class="card">${table(buckets)}</div>` : `
        <div class="card chart-card" id="card-trend">
          <div class="chart-head">
            <div><h2>הכנסות מול הוצאות לפי ${esc(grainWord)}</h2>
              <div class="chart-sub">${buckets.length} תקופות · בשקלים</div></div>
            <div class="legend">
              <span><i class="swatch" style="background:var(--series-income)"></i>הכנסות</span>
              <span><i class="swatch" style="background:var(--series-expense)"></i>הוצאות</span>
              <span><i class="swatch hatch"></i>אין נתוני הוצאה</span>
            </div></div>
          ${renderTrend(buckets)}<div class="tip" id="tip-trend"></div>
        </div>
        <div class="card chart-card" id="card-profit">
          <div class="chart-head">
            <div><h2>רווח לפי ${esc(grainWord)}</h2>
              <div class="chart-sub">מחושב רק לתקופות שיש בהן גם הכנסות וגם הוצאות רשומות</div></div>
            <div class="legend">
              <span><i class="swatch" style="background:var(--profit-pos)"></i>רווח</span>
              <span><i class="swatch" style="background:var(--profit-neg)"></i>הפסד</span>
              <span><i class="swatch hatch"></i>לא ניתן לחשב</span>
            </div></div>
          ${renderProfit(buckets)}<div class="tip" id="tip-profit"></div>
        </div>
        <details class="raw"><summary>הצג את אותם נתונים כטבלה</summary>${table(buckets)}</details>`}
    `;
    wire(buckets);
  }

  function wire(buckets) {
    const seg = (id, key) => document.getElementById(id)?.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return; state[key] = b.dataset.v; render();
    });
    seg('grain','grain'); seg('view','view');
    document.getElementById('rec')?.addEventListener('change', e => { state.includeReceipts = e.target.checked; render(); });
    document.getElementById('rev')?.addEventListener('change', e => { state.includeReview = e.target.checked; render(); });

    hover('card-trend','tip-trend', buckets, b => `
      <div class="t-row"><span>הכנסות</span><b>${esc(shekel(b.income))}</b></div>
      <div class="t-row"><span>הוצאות</span><b>${b.noExpenseData ? 'אין נתון' : esc(shekel(b.expenses))}</b></div>
      ${b.noExpenseData ? '<div class="t-note">אין אף הוצאה רשומה בתקופה זו</div>'
        : `<div class="t-row"><span>רווח</span><b>${esc(shekel(b.profit))}</b></div>`}`);

    hover('card-profit','tip-profit', buckets, b => b.noExpenseData
      ? `<div class="t-note">אין נתוני הוצאה — הרווח אינו ניתן לחישוב</div>`
      : `<div class="t-row"><span>רווח</span><b>${esc(shekel(b.profit))}</b></div>
         <div class="t-row"><span>שיעור</span><b>${b.income ? Math.round((b.profit/b.income)*100)+'%' : '—'}</b></div>`);
  }

  function hover(cardId, tipId, buckets, body) {
    const card = document.getElementById(cardId), tip = document.getElementById(tipId);
    const svg = card?.querySelector('svg'); if (!svg || !tip) return;
    svg.querySelectorAll('.hits rect').forEach(rect => {
      rect.addEventListener('mousemove', e => {
        const b = buckets[+rect.dataset.i];
        tip.innerHTML = `<div class="t-title">${esc(b.label)}</div>${body(b)}`;
        tip.classList.add('on');
        const box = card.getBoundingClientRect();
        let x = e.clientX - box.left + 14;
        if (x + tip.offsetWidth > box.width - 8) x = e.clientX - box.left - tip.offsetWidth - 14;
        tip.style.left = Math.max(8, x) + 'px';
        tip.style.top = Math.max(8, e.clientY - box.top - 10) + 'px';
      });
      rect.addEventListener('mouseleave', () => tip.classList.remove('on'));
    });
  }

  async function load() {
    try {
      const res = await fetch('/api/finance');
      const p = await res.json();
      if (!res.ok) throw new Error(p.hint || p.detail || p.error || 'שגיאה לא ידועה');
      state.data = p;
      stamp.textContent = 'עודכן ' + new Date(p.generatedAt).toLocaleString('he-IL');
      render();
    } catch (err) {
      app.innerHTML = `<div class="card"><div class="state err">לא הצלחתי לטעון נתונים ממאנדיי.<br><br>${esc(err.message)}</div></div>`;
    }
  }
  load();
})();
</script>
</body>
</html>
